[project]
name = "agente-liah"
version = "0.0.1"
description = "Agente Liah - asistente de WhatsApp multi-tenant que atiende, agenda y da seguimiento a los clientes de tu pyme, 24/7 y con tu tono."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pgvector>=0.2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "apscheduler[sqlalchemy]>=3.10",
    # Conector comercial + ingesta de conocimiento (Fase 2; instalados sueltos
    # en Fase 0, ahora declarados).
    "openai>=1.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    # Panel mínimo Fase 3: UI server-rendered (Jinja2, sin build step).
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "anyio>=4.3", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:datetime.datetime.utcnow",
]
