[project]
name = "agente-liah"
version = "0.0.1"
description = "Agente Liah - asistente de WhatsApp multi-tenant que atiende, agenda y da seguimiento a los clientes de tu pyme, 24/7 y con tu tono."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pgvector>=0.2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "anyio>=4.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:datetime.datetime.utcnow",
]
