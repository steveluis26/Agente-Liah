# Compose de PRODUCCIÓN — Esqueleto Liah (Fase 8)
#
# Uso (en el VPS):
#   cp infra/.env.example infra/.env   # y edita secretos
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# Servicios:
#   postgres  pgvector/pg16 (datos en volumen pgdata)
#   redis     cola/cache interno (sin puertos publicados)
#   migrate   aplica `alembic upgrade head` y termina (init container)
#   api       FastAPI :8000 (healthcheck en /health)
#   worker    drena jobs de WhatsApp, recordatorios, campañas, briefings
#
# Notas:
# - La API corre con 1 worker de uvicorn: el rate limiting es en memoria
#   por proceso. Si escalas a N réplicas, mueve el rate limit a Redis.
# - Postgres/Redis NO publican puertos por defecto; descomenta `ports`
#   solo para depuración (y ciérralos después).
# - LIAH_SEND_DRY_RUN=1 por defecto: los envíos reales a Meta/WhatsApp
#   están APAGADOS hasta que lo pongas en 0 con plantillas HSM aprobadas.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-pyme_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyme} -d ${POSTGRES_DB:-pyme_agent}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # ports:
    #   - "5432:5432"   # solo depuración

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file: infra/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]

  api:
    build: .
    env_file: infra/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    env_file: infra/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

volumes:
  pgdata:
