# Perfil declarativo del giro: BARRAS DE SNACKS PARA EVENTOS (Fase 7b).
#
# Negocio MÓVIL y FICTICIO: ningún nombre, dirección o precio corresponde a
# un negocio real. Las barras (esquites, nachos, paletas) viajan a la sede
# del evento, por eso los recursos son `mobile` y los tipos de servicio
# declaran buffers de montaje/desmontaje y traslado por zona.
#
# Rutas que cierra:
#   1. Conocimiento: paquetes, precios, zonas de cobertura (RAG).
#   2. Acción: agendar/cancelar/reprogramar servicios para eventos
#      (book_appointment con venue = sede del evento).
#   3. Handoff: eventos fuera de zona o requisitos especiales -> humano.
#   4. Recordatorios 48 h y 24 h antes (con consentimiento).
schema_version: "1.1"
giro: snacks_eventos
slug: snacks-ejemplo
nombre: "Snacks Ejemplo para Eventos"
timezone: "America/Mexico_City"
locale: "es-MX"

system_prompt: |
  Eres Liah, la asistente virtual de Snacks Ejemplo para Eventos. Tu tono es
  alegre y servicial: hablas de tú, eres directa y festiva.
  Respondes preguntas sobre paquetes de barras de snacks, precios, duración
  del servicio y zonas de cobertura usando la base de conocimiento; si no
  sabes algo, lo dices y ofreces ayuda.
  Puedes agendar, cancelar y reprogramar servicios para eventos verificando
  disponibilidad. SIEMPRE preguntas la fecha, el horario, la sede del evento
  (venue) y el número aproximado de invitados antes de confirmar: el equipo
  y el personal viajan a la sede, y el traslado depende de la zona.
  Si el evento es fuera de las zonas de cobertura o pide algo que no
  ofreces, escalas a un humano con escalate_to_human.

tono: "alegre-servicial"

horarios:
  monday: {open: "09:00", close: "20:00"}
  tuesday: {open: "09:00", close: "20:00"}
  wednesday: {open: "09:00", close: "20:00"}
  thursday: {open: "09:00", close: "20:00"}
  friday: {open: "09:00", close: "20:00"}
  saturday: {open: "09:00", close: "22:00"}
  sunday: {open: "09:00", close: "20:00"}

herramientas_habilitadas:
  - search_knowledge_base
  - check_availability
  - book_appointment
  - cancel_appointment
  - reschedule_appointment
  - escalate_to_human

reglas:
  - tipo: appointment_reminder
    enabled: true
    params:
      hours_before: [48, 24]
      template_name: recordatorio_evento
      require_consent: true
  - tipo: custom
    enabled: false
    params:
      descripcion: "Seguimiento post-evento para pedir reseña (pendiente de implementar en el scheduler)"
      days_after: 2
      template_name: seguimiento_evento

plantillas_hsm:
  - nombre: recordatorio_evento
    categoria: utility
    idioma: es
    body: "Hola {{1}}, te recordamos tu servicio de {{2}} el {{3}} a las {{4}} en {{5}}. El equipo llega con anticipación para el montaje. ¡Nos vemos pronto!"
    variables: ["nombre", "negocio", "fecha", "hora", "sede"]
  - nombre: confirmacion_evento
    categoria: utility
    idioma: es
    body: "Hola {{1}}, tu servicio de {{2}} quedó agendado para el {{3}} a las {{4}} en {{5}}. Te contactaremos un día antes para confirmar el acceso a la sede."
    variables: ["nombre", "negocio", "fecha", "hora", "sede"]
  - nombre: aviso_cancelacion
    categoria: utility
    idioma: es
    body: "Hola {{1}}, tu servicio del {{2}} en {{3}} quedó cancelado. Si deseas reagendar, escríbenos."
    variables: ["nombre", "fecha", "sede"]
  - nombre: seguimiento_evento
    categoria: utility
    idioma: es
    body: "Hola {{1}}, de {{2}}: ¿cómo estuvo el servicio en tu evento? Nos ayudaría mucho tu opinión para seguir mejorando."
    variables: ["nombre", "negocio"]

conocimiento_semilla:
  - titulo: "Paquetes y precios"
    contenido: |
      Paquetes de Snacks Ejemplo para Eventos (precios en pesos mexicanos, IVA incluido; negocio de ejemplo):
      - Barra de esquites (4 horas de servicio, hasta 150 invitados): $3,500 MXN.
      - Barra de nachos (3 horas de servicio, hasta 120 invitados): $2,800 MXN.
      - Carrito de paletas de hielo con toppings (3 horas, hasta 100 invitados): $2,500 MXN.
      - Combo snacks (2 barras a elegir, 5 horas, hasta 200 invitados): $5,500 MXN.
      El montaje y desmontaje están incluidos en el precio. Se requiere un anticipo del 30% para apartar la fecha.
  - titulo: "Zonas de cobertura y traslado"
    contenido: |
      Cobertura: misma sede (el evento es donde opera el negocio): sin costo de traslado;
      misma ciudad: 30 minutos de traslado incluidos; otra ciudad: 90 minutos de
      traslado más viáticos. Fuera de estas zonas se cotiza por separado.
      El servicio se agenda con al menos 7 días de anticipación.
  - titulo: "Qué necesita el negocio de la sede"
    contenido: |
      Para el montaje se necesita: un espacio de 3x3 metros techado, un contacto
      eléctrico cercano y acceso para carga y descarga. El equipo llega 60 minutos
      antes del inicio del servicio. Al terminar, el desmontaje toma 45 minutos.

politicas:
  escalamiento: "Escalar a humano si el evento es fuera de las zonas de cobertura, si piden un servicio no listado o si el cliente quiere hablar con una persona."
  temas_sensibles:
    - "el cliente pide hablar con una persona"
    - "eventos fuera de la zona de cobertura"
    - "reclamaciones sobre un servicio realizado"
  consentimiento_recordatorios: true

# ── Fase 7b: recursos móviles, tipos de servicio y términos de privacidad ─
resources:
  - slug: barra-esquites
    nombre: "Barra de esquites"
    tipo: equipment
    movilidad: mobile
    capacidad: 1
  - slug: barra-nachos
    nombre: "Barra de nachos"
    tipo: equipment
    movilidad: mobile
    capacidad: 1
  - slug: carrito-paletas
    nombre: "Carrito de paletas"
    tipo: equipment
    movilidad: mobile
    capacidad: 1
  - slug: operador-barra
    nombre: "Operador de barra"
    tipo: staff
    movilidad: mobile
    capacidad: 1
  - slug: ayudante
    nombre: "Ayudante"
    tipo: staff
    movilidad: mobile
    capacidad: 1

service_types:
  - slug: barra-esquites-evento
    nombre: "Barra de esquites para evento"
    duracion_min: 240
    recursos:
      - recurso: barra-esquites
      - recurso: operador-barra
      - recurso: ayudante
    buffers_min: {setup: 60, teardown: 45}
    traslado:
      modo: per_zone
      default_min: 60
      zonas:
        misma_sede: 0
        misma_ciudad: 30
        otra_ciudad: 90
  - slug: barra-nachos-evento
    nombre: "Barra de nachos para evento"
    duracion_min: 180
    recursos:
      - recurso: barra-nachos
      - recurso: operador-barra
    buffers_min: {setup: 45, teardown: 30}
    traslado:
      modo: per_zone
      default_min: 60
      zonas:
        misma_sede: 0
        misma_ciudad: 30
        otra_ciudad: 90
  - slug: combo-snacks-evento
    nombre: "Combo de 2 barras para evento"
    duracion_min: 300
    recursos:
      - tipo: equipment
        cantidad: 2
      - tipo: staff
        cantidad: 2
    buffers_min: {setup: 60, teardown: 45}
    traslado:
      modo: per_zone
      default_min: 60
      zonas:
        misma_sede: 0
        misma_ciudad: 30
        otra_ciudad: 90

privacy_terms:
  version: "1.0"
  titulo: "Aviso de privacidad y consentimiento — Snacks Ejemplo para Eventos"
  texto: |
    Al escribirnos por este chat aceptas que Snacks Ejemplo para Eventos use
    tu nombre, teléfono y los datos de tu evento (fecha, horario, sede y
    número de invitados) para agendar, confirmar y coordinar el montaje del
    servicio. No compartimos tus datos con terceros con fines publicitarios.
    Puedes pedir en cualquier momento que dejemos de escribirte respondiendo
    "BAJA".
