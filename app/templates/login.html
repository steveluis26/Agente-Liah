<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Panel Liah</title>
<style>
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f7f5f0;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .box { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:2rem;
         width:min(380px, 92vw); }
  h1 { margin:0 0 .3rem; font-size:1.3rem; }
  p.sub { color:#6b7280; font-size:.9rem; margin:0 0 1.2rem; }
  label { display:block; font-size:.85rem; font-weight:600; margin:.7rem 0 .25rem; }
  input { width:100%; border:1px solid #e5e7eb; border-radius:8px; padding:.55rem .6rem;
          font-size:.95rem; box-sizing:border-box; }
  button { width:100%; margin-top:1.1rem; background:#0f766e; color:#fff; border:none;
           border-radius:8px; padding:.65rem; font-size:1rem; cursor:pointer; }
  button:hover { background:#115e59; }
  .error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:8px;
           padding:.6rem .8rem; margin-bottom:.8rem; font-size:.9rem; }
</style>
</head>
<body>
<div class="box">
  <h1>Liah · Panel</h1>
  <p class="sub">Acceso de operadores (plataforma y tenants)</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
